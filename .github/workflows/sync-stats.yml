name: Sync Homepage Community Stats
on: { schedule: [{ cron: '0 0 * * 1' }], workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  sync-stats:
    runs-on: ubuntu-latest
    steps:
      - { name: Checkout, uses: actions/checkout@v4 }
      - { name: Setup Node.js, uses: actions/setup-node@v4, with: { node-version: '20' } }
      - { name: Sync stats, env: { YOUTUBE_API_KEY: "${{ secrets.YOUTUBE_API_KEY }}" }, run: "node scripts/sync-stats.mjs" }
      - { name: Commit and push, run: 'git diff --quiet _data/stats.json || (git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add _data/stats.json && git commit -m "chore(data): weekly sync homepage community stats [skip ci]" && git push)' }