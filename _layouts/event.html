<!DOCTYPE html>
<html lang="vi">

<head>
    <title>{{ page.title }} - CLB Thí Vua Lấy Tốt</title>
    {% include head.html %}
    <link type="text/css" rel="stylesheet" href="/css/eventwinner.css">
</head>

<body>
    {% include navbar.html %}

    <div id="section-page">
        <div class="container">
            <nav aria-label="Breadcrumb"><ul class="breadcrumb">
                <li><a href="/"><span class="bx bx-home-alt-2"></span>Trang chủ</a></li>
                <li><a href="/events/tournaments">Giải đấu</a></li>
                <li aria-current="page">{{ page.title }}</li>
            </ul></nav>
            {{ content }}
            <br>
            <button id="back-to-top" title="Quay lại đầu trang"><span class="bx bxs-to-top"></span></button>
        </div>
    </div>
    {% include footer.html %}

    <div id="scoreModal" class="cc-modal-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-player-name">
        <div class="cc-modal-dialog score-modal-dialog" role="document" tabindex="-1">
            <button type="button" class="cc-modal-close" aria-label="Đóng cửa sổ">×</button>
            <div class="cc-modal-content-wrapper">
                <div class="cc-modal-header-row">
                    <div class="cc-modal-title-section">
                        <h2 id="modal-player-name">Chi tiết điểm</h2>
                    </div>
                </div>
                <div id="modal-score-breakdown"></div>
            </div>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script src="/js/search-events.js"></script>
    <script src="/js/tournament-fetcher.js"></script>
</body>

</html>
